name: Deploy to Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate generators index
        run: |
          cd generators
          echo "[" > index.json
          first=true
          for f in *.txt; do
            # Extract $name from file, fallback to filename
            name=$(grep -m1 '^\$name' "$f" | sed 's/^\$name[[:space:]]*:[[:space:]]*//' || echo "${f%.txt}")
            [ -z "$name" ] && name="${f%.txt}"
            $first || echo "," >> index.json
            printf '  {"name": "%s", "file": "%s"}' "$name" "$f" >> index.json
            first=false
          done
          echo "" >> index.json
          echo "]" >> index.json
          cat index.json

      - name: Build static site directory
        run: |
          mkdir -p _site/lib _site/generators
          cp index.html _site/
          cp lib/stringalong.js _site/lib/
          cp generators/*.txt generators/index.json _site/generators/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
